server:
  port: 9000

spring:
  application:
    name: dev-auth-server
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      authorizationserver:
        issuer: ${SECURE_LEDGER_ISSUER_URI:http://localhost:9000}
        client:
          # Machine-to-machine demo clients. Secrets have no default on purpose: start-up fails until
          # they are set in .env. "{noop}" keeps them in memory as given; this server is dev-only.
          wallet:
            registration:
              client-id: demo-wallet
              client-secret: "{noop}${SECURE_LEDGER_WALLET_CLIENT_SECRET}"
              client-authentication-methods: client_secret_basic,client_secret_post
              authorization-grant-types: client_credentials
              scopes: ledger.read,ledger.operate
            token:
              access-token-time-to-live: 15m
          marketplace:
            registration:
              client-id: demo-marketplace
              client-secret: "{noop}${SECURE_LEDGER_MARKETPLACE_CLIENT_SECRET}"
              client-authentication-methods: client_secret_basic,client_secret_post
              authorization-grant-types: client_credentials
              scopes: ledger.read,ledger.operate
            token:
              access-token-time-to-live: 15m
          auditor:
            registration:
              client-id: demo-auditor
              client-secret: "{noop}${SECURE_LEDGER_AUDITOR_CLIENT_SECRET}"
              client-authentication-methods: client_secret_basic,client_secret_post
              authorization-grant-types: client_credentials
              scopes: ledger.audit
            token:
              access-token-time-to-live: 15m
