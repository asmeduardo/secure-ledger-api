spring:
  application:
    name: ledger-api
  config:
    # Lets a developer keep local settings in a .env file at the repository root (ignored by Git).
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledger}
    username: ${POSTGRES_USER:ledger}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping matches it.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are fetched lazily from the JWKS endpoint, so the API starts even if the issuer is down.
          # Tokens must carry this issuer, while the keys may be fetched from another address.
          issuer-uri: ${SECURE_LEDGER_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${SECURE_LEDGER_JWK_SET_URI:${SECURE_LEDGER_ISSUER_URI:http://localhost:9000}/oauth2/jwks}
          # Only tokens minted for this API are accepted, even if the issuer serves other APIs too.
          audiences: secure-ledger-api
